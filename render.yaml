# Render Blueprint — provisions both case-study backends as free web services.
# Apply at https://dashboard.render.com/blueprints by pointing at this repo.

services:
  # ---------- Case Study A — FastAPI ----------
  - type: web
    name: agent-mira-price-api
    runtime: python
    plan: free
    rootDir: junior_case_study_package_v2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"

  # ---------- Case Study B — Express ----------
  - type: web
    name: agent-mira-chatbot-api
    runtime: node
    plan: free
    rootDir: real_estate_chatbot/backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # CORS_ORIGIN and MONGO_URI (and optional OPENAI_API_KEY) must be set
      # in the Render dashboard after the Vercel frontend URL is known.
      - key: CORS_ORIGIN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
